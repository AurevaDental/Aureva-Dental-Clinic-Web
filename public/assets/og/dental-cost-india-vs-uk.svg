      <stop offset="100%" stop-color="#E8E2D5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#D3C7B5" stroke-width="2"/>

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
