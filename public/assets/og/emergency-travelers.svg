  </text>

  <!-- Bottom Badges -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="300" height="50" rx="25" fill="#FCEAE6" stroke="#E5C7BE" stroke-width="1.5"/>
    <text x="20" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#B91C1C">✓ Urgent Dental Assessment</text>

    <rect x="320" y="0" width="300" height="50" rx="25" fill="#FCEAE6" stroke="#E5C7BE" stroke-width="1.5"/>
    <text x="20" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#B91C1C">✓ Open 7 Days &bull; Sundays Open</text>

    <rect x="640" y="0" width="340" height="50" rx="25" fill="#FCEAE6" stroke="#E5C7BE" stroke-width="1.5"/>
    <text x="20" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#B91C1C">✓ Travel Insurance Documentation</text>
  </g>
