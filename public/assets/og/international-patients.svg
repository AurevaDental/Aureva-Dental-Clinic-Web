<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#EAE3D2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D3C7B5" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#D3C7B5" stroke-width="2"/>

  <!-- Brand Badge Top -->
  <g transform="translate(80, 80)">
    <rect width="360" height="44" rx="22" fill="#4A5844" opacity="0.1"/>
    <rect width="360" height="44" rx="22" fill="none" stroke="#4A5844" stroke-width="1.5" opacity="0.3"/>
    <text x="24" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#4A5844" letter-spacing="2">AUREVA DENTAL • BENGALURU</text>
  </g>

  <!-- Location Pill Top Right -->
  <g transform="translate(760, 80)">
    <rect width="360" height="44" rx="22" fill="#4A5844"/>
    <text x="36" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#F5F2EB" letter-spacing="1">📍 HENNUR • NORTH BANGALORE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="240" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="600" fill="#2B2C28" letter-spacing="-1">
    International Patient
  </text>
  <text x="80" y="305" font-family="'Playfair Display', Georgia, serif" font-size="52" font-style="italic" font-weight="500" fill="#4A5844" letter-spacing="-1">
    Dental Care in North Bangalore
  </text>

  <!-- Subheadline -->
  <text x="80" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400" fill="#4A5844">
    Conveniently Accessible from Kempegowda International Airport
  </text>
  <text x="80" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="300" fill="#6A685F">
    Restorative, Implant &amp; Smile Dentistry &bull; Published INR Pricing &bull; Open 7 Days
  </text>

  <!-- Feature Tags Bottom -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="300" height="50" rx="25" fill="#EAE3D2" stroke="#D3C7B5" stroke-width="1.5"/>
    <text x="24" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2C28">✓ Pre-Travel Record Review</text>

    <!-- Pill 2 -->
    <rect x="320" y="0" width="300" height="50" rx="25" fill="#EAE3D2" stroke="#D3C7B5" stroke-width="1.5"/>
    <text x="24" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2C28">✓ Published INR Pricing</text>

    <!-- Pill 3 -->
    <rect x="640" y="0" width="340" height="50" rx="25" fill="#EAE3D2" stroke="#D3C7B5" stroke-width="1.5"/>
    <text x="24" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2C28">✓ Open 7 Days &bull; Fluent English</text>
  </g>
</svg>
